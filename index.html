<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero Backgrounds</title>
<meta name="description" content="Animated canvas backgrounds in one small file. No dependencies, no network.">
<style>
:root{--bg:#F4F5F0;--ink:#1F2421;--muted:#566057;--glass:rgba(255,255,255,.72);--line:rgba(31,36,33,.14);--accent:#0B7A4B;--on:#fff;--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D110F;--ink:#EEF3EF;--muted:#A3ADA5;--glass:rgba(18,23,20,.72);--line:rgba(238,243,239,.16);--accent:#5BC98F;--on:#0E1411;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0D110F;--ink:#EEF3EF;--muted:#A3ADA5;--glass:rgba(18,23,20,.72);--line:rgba(238,243,239,.16);--accent:#5BC98F;--on:#0E1411;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:72px max(20px,env(safe-area-inset-right)) 220px max(20px,env(safe-area-inset-left))}
.hero{position:relative;z-index:1;max-width:720px}
.hero h1{font-size:clamp(38px,7vw,84px);line-height:1.02;margin:0 0 16px;letter-spacing:-.03em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:clamp(17px,2.2vw,22px)}
.stage{padding-bottom:140px}
body:has(.panel[open]) .stage{padding-right:392px}
.top{position:fixed;z-index:3;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:12px}
.mark{font-weight:600;letter-spacing:-.01em}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill{min-height:44px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--accent)}
.modes .pill[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.links{display:flex;gap:8px}
.dock{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}.dock:has(.panel:not([open])){align-items:flex-start}
.dock>*{pointer-events:auto}
.modes{display:flex;flex-wrap:wrap;gap:8px;max-width:640px}
.panel{width:340px;max-width:100%;border-radius:18px;padding:0 18px}.panel[open]{padding-bottom:18px}
.panel summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px;cursor:pointer;font-weight:600}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"Hide";color:var(--muted);font-weight:400;font-size:14px}
.panel:not([open]) summary::after{content:"Show"}
.panel h2{margin:12px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:10px;font-size:15px;min-height:40px}
.row output{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}.chk input{width:18px;height:18px;accent-color:var(--accent)}
pre{margin:0;background:rgba(0,0,0,.08);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 var(--mono);overflow:auto;max-height:150px;white-space:pre}
.cp{margin-top:10px;width:100%;justify-content:center;border:1.5px solid var(--line);background:transparent}
@media(max-width:760px){
  body:has(.panel[open]) .stage{padding-right:max(20px,env(safe-area-inset-right))}
  .dock{flex-direction:column;align-items:stretch}
  .panel{width:100%}
  .modes{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}.modes .pill{flex:none}
  .mark{display:none}
}
</style>
</head>
<body>
<section class="stage" id="stage"><div class="hero"><h1>Backgrounds that stay out of the way</h1><p>Eight animated modes in one small file. No dependencies, no network.</p></div></section>
<div class="top"><span class="mark">hero-backgrounds</span><div class="links"><a class="pill glass" href="https://github.com/holroydchase-afk/hero-backgrounds">GitHub</a><button class="pill glass" id="tog" aria-pressed="false">Dark</button></div></div>
<div class="dock">
<div class="modes" id="modes" role="group" aria-label="Mode"></div>
<details class="panel glass" id="panel" open>
<summary>Settings</summary>
<h2>1. Customize</h2>
<div class="row"><label for="col">Color</label><input type="color" id="col" value="#0b7a4b"><output></output></div>
<div class="row"><label for="spd">Speed</label><input type="range" id="spd" min="0" max="3" step=".25" value="1"><output id="spdo">1</output></div>
<div class="row"><label for="den">Density</label><input type="range" id="den" min=".4" max="2" step=".1" value="1"><output id="deno">1</output></div>
<label class="chk"><input type="checkbox" id="mouse" checked> React to the pointer</label>
<h2>2. Grab the code</h2>
<pre id="code"></pre>
<button class="pill cp" id="cp">Copy snippet</button>
</details>
</div>
<script>
/*! hero-backgrounds.js: animated canvas backgrounds in one small file. No dependencies, no network.
    HeroBG(element, { mode: 'constellation', color: '#4A6B4C', speed: 1, density: 1 })  -> { setOptions, destroy }
    Modes: constellation, neural, organic, flow, grid, dots, waves, threads. MIT licence. */
(function (root) {
  'use strict';
  var TAU = Math.PI * 2;
  var DEFAULTS = {
    mode: 'constellation',
    color: '#4A6B4C',       // accent: signals, hubs, highlights
    line: null,             // line/dot base colour; default is the accent at low opacity
    accent2: null,          // optional second accent (hubs in organic); default = color
    speed: 1,               // 0 freezes, 2 is double
    density: 1,             // more or fewer elements
    mouse: true,            // respond to the pointer where the mode supports it
    background: null        // CSS colour behind the canvas, or null for transparent
  };

  function rgb(c) {         // '#abc' | '#aabbcc' | 'rgb(...)' -> [r,g,b]
    if (Array.isArray(c)) return c;
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c).trim());
    if (m) { var h = m[1]; if (h.length === 3) h = h.replace(/./g, '$&$&'); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4), 16)]; }
    var n = String(c).match(/[\d.]+/g); return n ? [+n[0], +n[1], +n[2]] : [74, 107, 76];
  }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t].map(Math.round); }

  /* Each mode: init(S) builds state from S.W, S.H, S.o; draw(S, t, dt) paints one frame. */
  var MODES = {};

  MODES.constellation = {
    init: function (S) {
      var n = Math.round(S.W * S.H / 26000 * S.o.density); S.p = [];
      for (var i = 0; i < n; i++) S.p.push({ x: Math.random() * S.W, y: Math.random() * S.H, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22, a: i % 7 === 0 });
    },
    draw: function (S, t, dt) {
      var c = S.cx, p = S.p, i, j, a, b, d, k = dt * 60 * S.o.speed;
      c.lineWidth = 1;
      for (i = 0; i < p.length; i++) {
        a = p[i]; a.x += a.vx * k; a.y += a.vy * k;
        if (a.x < 0 || a.x > S.W) a.vx *= -1; if (a.y < 0 || a.y > S.H) a.vy *= -1;
        for (j = i + 1; j < p.length; j++) {
          b = p[j]; d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 150) { c.strokeStyle = rgba(S.line, (1 - d / 150) * .9); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
        }
      }
      p.forEach(function (a) { c.fillStyle = a.a ? rgba(S.accent, 1) : rgba(S.line, 1); c.beginPath(); c.arc(a.x, a.y, a.a ? 3 : 2, 0, TAU); c.fill(); });
    }
  };

  MODES.neural = {
    init: function (S) {
      var L = S.W < 700 ? 5 : 8, per = Math.max(4, Math.round(S.H / 135 * S.o.density)), layers = [], i, j;
      S.n = []; S.e = []; S.pulses = []; S.last = 0;
      for (i = 0; i < L; i++) {
        var col = [], x0 = S.W * (.03 + .94 * i / (L - 1));
        for (j = 0; j < per; j++) { var n = { x: x0 + (Math.random() - .5) * 26, y: S.H * (.06 + .88 * (j + .5) / per) + (Math.random() - .5) * 30, p: Math.random() * TAU, g: 0 }; col.push(n); S.n.push(n); }
        layers.push(col);
      }
      for (i = 0; i < L - 1; i++) layers[i].forEach(function (a, j) { [j - 1, j, j + 1].forEach(function (t) { if (t >= 0 && t < per && (t === j || Math.random() < .6)) S.e.push([a, layers[i + 1][t]]); }); });
    },
    draw: function (S, t) {
      var c = S.cx, T = t * S.o.speed;
      S.n.forEach(function (n) { n._x = n.x + Math.sin(T * .35 + n.p) * 4; n._y = n.y + Math.cos(T * .3 + n.p * 1.3) * 4; });
      c.lineWidth = 1; c.strokeStyle = rgba(S.line, .7); c.beginPath();
      S.e.forEach(function (e) { c.moveTo(e[0]._x, e[0]._y); c.lineTo(e[1]._x, e[1]._y); }); c.stroke();
      if (S.o.speed > 0) {
        if (t - S.last > .52 / S.o.speed) { S.last = t; S.pulses.push({ e: S.e[Math.floor(Math.random() * S.e.length)], t0: t, d: 1.5 / S.o.speed }); }
        S.pulses = S.pulses.filter(function (p) {
          var k = (t - p.t0) / p.d; if (k >= 1) { p.e[1].g = t; return false; }
          var a = p.e[0], b = p.e[1], k0 = Math.max(0, k - .18);
          c.strokeStyle = rgba(S.accent, .85); c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
          c.moveTo(a._x + (b._x - a._x) * k0, a._y + (b._y - a._y) * k0); c.lineTo(a._x + (b._x - a._x) * k, a._y + (b._y - a._y) * k); c.stroke(); return true;
        });
      }
      S.n.forEach(function (n) {
        var g = n.g ? Math.max(0, 1 - (t - n.g)) : 0;
        c.fillStyle = g > 0 ? rgba(S.accent, .5 + .5 * g) : rgba(S.line, 1);
        c.beginPath(); c.arc(n._x, n._y, 2.4 + 2.2 * g, 0, TAU); c.fill();
      });
    }
  };

  MODES.organic = {
    init: function (S) {
      var cnt = Math.max(30, Math.min(110, Math.round(S.W * S.H / 17000 * S.o.density))), d0 = Math.sqrt(S.W * S.H / cnt) * .72, tries = 0, seen = {};
      S.n = []; S.e = []; S.pulses = []; S.last = 0;
      while (S.n.length < cnt && tries++ < cnt * 40) {
        var x = Math.random() * S.W, y = Math.random() * S.H;
        if (S.n.every(function (o) { return (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y) >= d0 * d0; })) S.n.push({ x: x, y: y, p: Math.random() * TAU, deg: 0, g: 0 });
      }
      S.n.forEach(function (a, i) {
        S.n.map(function (b, j) { return { j: j, d: Math.hypot(a.x - b.x, a.y - b.y) }; })
          .filter(function (o) { return o.j !== i && o.d < d0 * 2.3; }).sort(function (p, q) { return p.d - q.d; }).slice(0, 3)
          .forEach(function (o) {
            var k = Math.min(i, o.j) + '-' + Math.max(i, o.j); if (seen[k]) return; seen[k] = 1;
            S.e.push([i, o.j, ((i * 7 + o.j * 13) % 2 ? 1 : -1) * o.d * (.1 + ((i + o.j) % 5) * .03)]); a.deg++; S.n[o.j].deg++;
          });
      });
      S.n.forEach(function (n) { if (n.deg >= 5) { n.k = 0; n.r = 5.5 + n.deg * .7; } else if (n.deg <= 2) { n.k = 2; n.r = 3; } else { n.k = 1; n.r = 2.8 + n.deg * .5; } });
    },
    draw: function (S, t) {
      var c = S.cx, T = t * S.o.speed, A2 = S.accent2 || S.accent;
      var pos = S.n.map(function (n) { return { x: n.x + Math.sin(T * .3 + n.p) * 6, y: n.y + Math.cos(T * .25 + n.p) * 6 }; });
      function curve(e) { var a = pos[e[0]], b = pos[e[1]], dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1; return { a: a, b: b, x: (a.x + b.x) / 2 - dy / l * e[2], y: (a.y + b.y) / 2 + dx / l * e[2] }; }
      c.lineWidth = 1.2; c.strokeStyle = rgba(S.line, .8); c.beginPath();
      S.e.forEach(function (e) { var q = curve(e); c.moveTo(q.a.x, q.a.y); c.quadraticCurveTo(q.x, q.y, q.b.x, q.b.y); }); c.stroke();
      if (S.o.speed > 0) {
        if (t - S.last > .48 / S.o.speed) { S.last = t; S.pulses.push({ e: Math.floor(Math.random() * S.e.length), t0: t, d: (1.8 + Math.random() * .9) / S.o.speed, f: Math.random() < .5 }); }
        S.pulses = S.pulses.filter(function (p) {
          var k = (t - p.t0) / p.d, e = S.e[p.e]; if (k >= 1) { S.n[p.f ? e[0] : e[1]].g = t; return false; }
          var q = curve(e), u = p.f ? 1 - k : k, v = 1 - u;
          c.fillStyle = rgba(S.accent, .85 * Math.sin(k * Math.PI)); c.beginPath();
          c.arc(v * v * q.a.x + 2 * v * u * q.x + u * u * q.b.x, v * v * q.a.y + 2 * v * u * q.y + u * u * q.b.y, 2.6, 0, TAU); c.fill(); return true;
        });
      }
      S.n.forEach(function (n, i) {
        var p = pos[i], gl = n.g ? Math.max(0, 1 - (t - n.g) / .9) : 0;
        c.beginPath(); c.arc(p.x, p.y, n.r + gl * 2.5, 0, TAU);
        if (n.k === 0) { c.fillStyle = rgba(A2, .55 + gl * .4); c.fill(); c.lineWidth = 1.2; c.strokeStyle = rgba(A2, .35); c.beginPath(); c.arc(p.x, p.y, n.r + 5, 0, TAU); c.stroke(); }
        else if (n.k === 1) { c.fillStyle = rgba(S.accent, .4 + gl * .5); c.fill(); }
        else { c.lineWidth = 1.4; c.strokeStyle = rgba(S.accent, .5 + gl * .4); c.stroke(); }
      });
    }
  };

  MODES.flow = {
    init: function (S) { S.s = []; for (var i = 0, n = Math.round(S.W / 11 * S.o.density); i < n; i++) S.s.push({ x: Math.random() * S.W, y: Math.random() * S.H, c: i % 3 }); },
    draw: function (S, t) {
      var c = S.cx, T = t * S.o.speed; c.lineWidth = 1.1;
      S.s.forEach(function (s) {
        var x = s.x, y = s.y; c.strokeStyle = s.c === 0 ? rgba(S.accent, .3) : rgba(S.line, .7); c.beginPath(); c.moveTo(x, y);
        for (var i = 0; i < 70; i++) { var a = Math.sin(x * .0021 + T * .07) * 2.2 + Math.cos(y * .0027 - T * .05) * 2.2 + Math.sin((x + y) * .0011) * 1.5; x += Math.cos(a) * 7; y += Math.sin(a) * 7; c.lineTo(x, y); }
        c.stroke();
      });
    }
  };

  MODES.grid = {
    init: function (S) { S.G = Math.round((S.W < 700 ? 44 : 56) / Math.sqrt(S.o.density)); S.pulses = []; S.last = 0; },
    draw: function (S, t) {
      var c = S.cx, G = S.G, W = S.W, H = S.H, x, y;
      c.lineWidth = 1; c.strokeStyle = rgba(S.line, .8); c.beginPath();
      for (x = 0; x <= W; x += G) { c.moveTo(x + .5, 0); c.lineTo(x + .5, H); }
      for (y = 0; y <= H; y += G) { c.moveTo(0, y + .5); c.lineTo(W, y + .5); }
      c.stroke();
      if (S.o.speed > 0) {
        if (t - S.last > .42 / S.o.speed) { S.last = t; var h = Math.random() < .5; S.pulses.push({ h: h, l: Math.floor(Math.random() * ((h ? H : W) / G)) * G + .5, p: Math.random() * (h ? W : H), d: Math.random() < .5 ? 1 : -1, s: 140 + Math.random() * 180, t0: t, life: 2.6 / S.o.speed }); }
        S.pulses = S.pulses.filter(function (q) {
          var k = t - q.t0; if (k > q.life) return false;
          var pos = q.p + q.d * q.s * S.o.speed * k, al = 1 - k / q.life, tl = 60 * q.d, a = q.h ? [pos, q.l, pos - tl, q.l] : [q.l, pos, q.l, pos - tl];
          var g = c.createLinearGradient(a[0], a[1], a[2], a[3]); g.addColorStop(0, rgba(S.accent, .9 * al)); g.addColorStop(1, rgba(S.accent, 0));
          c.strokeStyle = g; c.lineWidth = 2; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(a[2], a[3]); c.stroke(); return true;
        });
      }
      if (S.o.mouse && S.m.on) {
        c.fillStyle = rgba(S.accent, 1);
        for (x = 0; x <= W; x += G) for (y = 0; y <= H; y += G) {
          var a2 = Math.max(0, 1 - Math.hypot(x - S.m.x, y - S.m.y) / 170);
          if (a2 > 0) { c.globalAlpha = a2 * .8; c.beginPath(); c.arc(x + .5, y + .5, 1.5 + 2.5 * a2, 0, TAU); c.fill(); }
        }
        c.globalAlpha = 1;
      }
    }
  };

  MODES.dots = {
    init: function (S) { S.tx = S.ty = 0; },
    draw: function (S, t) {
      var c = S.cx, mx = S.o.mouse && S.m.on ? S.m.x / S.W - .5 : 0, my = S.o.mouse && S.m.on ? S.m.y / S.H - .5 : 0, T = t * S.o.speed;
      S.tx += (mx - S.tx) * .05; S.ty += (my - S.ty) * .05;
      var ax = Math.sin(T * .25) * 5, ay = Math.cos(T * .2) * 4;
      function layer(G, off, r, col, px, py) {
        c.fillStyle = col; c.beginPath();
        for (var y = -G + (off + py) % G; y < S.H + G; y += G) for (var x = -G + (off + px) % G; x < S.W + G; x += G) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); }
        c.fill();
      }
      layer(28 / Math.sqrt(S.o.density), 14, 1.3, rgba(S.line, 1), S.tx * 10 + ax, S.ty * 10 + ay);
      layer(84 / Math.sqrt(S.o.density), 0, 3, rgba(S.accent, .8), -S.tx * 22 - ax * 2, -S.ty * 22 - ay * 2);
    }
  };

  MODES.waves = {
    init: function () {},
    draw: function (S, t) {
      var c = S.cx, T = t * S.o.speed, n = Math.round(9 * S.o.density), W = S.W, H = S.H, i, x;
      c.lineWidth = 1.3;
      for (i = 0; i < n; i++) {
        var f = i / (n - 1), base = H * (.3 + .6 * f), amp = 16 + 34 * f;
        c.strokeStyle = i === n - 1 ? rgba(S.accent, .55) : rgba(mix(S.line, S.accent, f * .5), .35 + .5 * f);
        c.beginPath();
        for (x = 0; x <= W; x += 8) {
          var y = base + Math.sin(x * .004 + T * .35 + i * .6) * amp + Math.sin(x * .011 - T * .5 + i) * amp * .35;
          x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
      }
    }
  };

  MODES.threads = {
    init: function () {},
    draw: function (S, t) {
      var c = S.cx, T = t * S.o.speed, W = S.W, H = S.H, tx = W / 2, ty = Math.min(H * .42, 380), n = Math.round(56 * S.o.density);
      c.lineWidth = 1.2;
      for (var i = 0; i < n; i++) {

<script>
(function(){
var r=document.documentElement,tog=document.getElementById('tog'),stage=document.getElementById('stage'),panel=document.getElementById('panel');

var dock=document.querySelector('.dock');
function fit(){stage.style.paddingBottom=matchMedia('(max-width:760px)').matches?(dock.offsetHeight+32)+'px':''}
fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(dock);addEventListener('resize',fit);
var opts={mode:'constellation',color:'#0b7a4b',speed:1,density:1,mouse:true},bg;
try{bg=HeroBG(stage,opts)}catch(e){console.error(e)}
function isDark(){return r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function lab(){tog.textContent=isDark()?'Light':'Dark';tog.setAttribute('aria-pressed',isDark())}
var userColor=false;
function themeColor(){if(!userColor){opts.color=isDark()?'#5bc98f':'#0b7a4b';document.getElementById('col').value=opts.color;bg.setOptions({color:opts.color});code()}}
tog.onclick=function(){r.dataset.theme=isDark()?'light':'dark';lab();themeColor()};lab();
var box=document.getElementById('modes');
HeroBG.modes.forEach(function(m){var b=document.createElement('button');b.className='pill glass';b.textContent=m;b.setAttribute('aria-pressed',m===opts.mode);b.onclick=function(){opts.mode=m;bg.setOptions({mode:m});box.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});code()};box.appendChild(b)});
function bind(id,key,outId,num){var el=document.getElementById(id);el.oninput=function(){var v=num?+el.value:el.value;opts[key]=v;if(outId)document.getElementById(outId).textContent=v;if(key==='color')userColor=true;var o={};o[key]=v;bg.setOptions(o);code()}}
bind('col','color');bind('spd','speed','spdo',1);bind('den','density','deno',1);
document.getElementById('mouse').onchange=function(e){opts.mouse=e.target.checked;bg.setOptions({mouse:opts.mouse});code()};
var pre=document.getElementById('code');
function code(){pre.textContent='<section id="hero">\n  <h1>Your headline</h1>\n</section>\n<script src="hero-backgrounds.js"><\/script>\n<script>\n  HeroBG("#hero", {\n    mode: "'+opts.mode+'",\n    color: "'+opts.color+'",\n    speed: '+opts.speed+',\n    density: '+opts.density+',\n    mouse: '+opts.mouse+'\n  });\n<\/script>'}
code();themeColor();
var cp=document.getElementById('cp');
cp.onclick=function(){var t=pre.textContent;function ok(){cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy snippet'},1500)}
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}function fb(){var s=getSelection(),g=document.createRange();g.selectNodeContents(pre);s.removeAllRanges();s.addRange(g);cp.textContent='Selected, press copy'}};
})();
